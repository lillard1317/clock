<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Desk Clock & Calendar</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="置き時計">
    
    <link rel="stylesheet" href="style.css">
    <style>
        /* スクロールを滑らかにする設定 */
        html, body {
            overflow-y: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .day:not(.empty) {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.1s ease;
        }
        .day:not(.empty):active {
            opacity: 0.6;
        }
        /* 祝日用のスタイル（日曜と同じ赤色を適用） */
        .day.holiday {
            color: #e34234;
        }

        /* 日付をタップしたときの色（選択状態） */
        .day.selected {
            background-color: #e5e5ea !important; /* Apple風のやさしいグレー */
            color: #1d1d1f !important;            /* 文字色をはっきりさせる */
            font-weight: 600;
            transform: scale(0.9);                /* タップした時に少しだけ小さく */
        }

        /* 無限スクロールの検知用エリア */
        #scroll-anchor {
            width: 100%;
            height: 50px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 上部：デジタル時計エリア -->
        <header class="clock-section">
            <div id="clock">00:00</div>
            <div id="date-display">2026年01月01日 (木)</div>
        </header>

        <!-- 下部：カレンダーエリア（ここに3ヶ月ずつ追加されていきます） -->
        <main class="calendar-section" id="calendar-container">
            <!-- JavaScriptで動的に生成します -->
        </main>
        
        <!-- 下端を検知するための透明な目印 -->
        <div id="scroll-anchor"></div>
    </div>

    <script>
        const weekDays = ['日', '月', '火', '水', '木', '金', '土'];
        
        // 現在どこまでカレンダーを作ったかを管理する変数
        let loadedMonthsCount = 0;

        // 1. 日本の祝日判定ロジック (2026年〜2027年対応)
        function checkHoliday(year, month, day) {
            const m = month + 1; // 1月〜12月に変換
            const dateObj = new Date(year, month, day);
            const w = dateObj.getDay(); // 0:日, 1:月, ... 6:土
            const nthWeek = Math.floor((day - 1) / 7) + 1; // 第何曜日か

            if (m === 1 && day === 1) return "元日";
            if (m === 2 && day === 11) return "建国記念の日";
            if (m === 2 && day === 23) return "天皇誕生日";
            if (m === 4 && day === 29) return "昭和の日";
            if (m === 5 && day === 3) return "憲法記念日";
            if (m === 5 && day === 4) return "みどりの日";
            if (m === 5 && day === 5) return "こどもの日";
            if (m === 8 && day === 11) return "山の日";
            if (m === 11 && day === 3) return "文化の日";
            if (m === 11 && day === 23) return "勤労感謝の日";

            if (m === 1 && w === 1 && nthWeek === 2) return "成人の日";
            if (m === 7 && w === 1 && nthWeek === 3) return "海の日";
            if (m === 9 && w === 1 && nthWeek === 3) return "敬老の日";
            if (m === 10 && w === 1 && nthWeek === 2) return "スポーツの日";

            if (m === 3 && day === 20) return "春分の日";
            if (m === 9 && day === 23) return "秋分の日の簡易計算";

            if (w === 1) { 
                if (checkHoliday(year, month, day - 1) && new Date(year, month, day - 1).getDay() === 0) {
                    return "振替休日";
                }
            }
            if (m === 5 && day === 6 && w === 3) {
                return "振替休日";
            }

            return null; 
        }

        // 2. 時計・日付の更新ロジック
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;

            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const day = weekDays[now.getDay()];
            document.getElementById('date-display').textContent = `${year}年${month}月${date}日 (${day})`;

            // 夜中の 00:00 になったらカレンダーを完全リセットして最新の「今月」からにする
            if (hours === '00' && minutes === '00' && now.getSeconds() === 0) {
                resetAndRenderInitialCalendars();
            }
        }

        // 3. タップした日付を保存・削除する関数
        function toggleSelectDay(element, year, month, day) {
            if (element.classList.contains('today')) return;

            element.classList.toggle('selected');
            const key = `date-${year}-${month}-${day}`;
            
            if (element.classList.contains('selected')) {
                localStorage.setItem(key, 'true');
            } else {
                localStorage.removeItem(key);
            }
        }

        // 4. カレンダーHTML生成ロジック
        function generateCalendarHTML(year, month, currentDayObj) {
            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();
            
            let html = `<h2>${year}年 ${month + 1}月</h2>`;
            html += `<div class="calendar-grid">`;
            
            weekDays.forEach((day, idx) => {
                const dayClass = idx === 0 ? 'sun' : (idx === 6 ? 'sat' : '');
                html += `<div class="weekday ${dayClass}">${day}</div>`;
            });

            for (let i = 0; i < firstDay; i++) {
                html += `<div class="day empty"></div>`;
            }

            for (let d = 1; d <= lastDate; d++) {
                let dayClasses = ['day'];
                const currentWeekDay = (firstDay + d - 1) % 7;
                
                if (currentWeekDay === 0) dayClasses.push('sun');
                if (currentWeekDay === 6) dayClasses.push('sat');

                const holidayName = checkHoliday(year, month, d);
                if (holidayName) {
                    dayClasses.push('holiday');
                }

                const isToday = currentDayObj && 
                                year === currentDayObj.getFullYear() && 
                                month === currentDayObj.getMonth() && 
                                d === currentDayObj.getDate();

                if (isToday) {
                    dayClasses.push('today');
                }

                const savedKey = `date-${year}-${month}-${d}`;
                if (!isToday && localStorage.getItem(savedKey)) {
                    dayClasses.push('selected');
                }

                const titleAttr = holidayName ? `title="${holidayName}"` : '';

                html += `<div class="${dayClasses.join(' ')}" ${titleAttr} onclick="toggleSelectDay(this, ${year}, ${month}, ${d})">${d}</div>`;
            }

            html += `</div>`;
            return html;
        }

        // 5. カレンダーを次の3ヶ月分追加する関数
        function loadNextThreeMonths() {
            const container = document.getElementById('calendar-container');
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth();

            // 3ヶ月分ループしてカードを生成
            for (let i = 0; i < 3; i++) {
                const targetDate = new Date(currentYear, currentMonth + loadedMonthsCount, 1);
                const targetYear = targetDate.getFullYear();
                const targetMonth = targetDate.getMonth();

                // カレンダーカード（箱）を作って中身を入れる
                const card = document.createElement('div');
                card.className = 'calendar-card';
                // 最初（今月）だけ「今日」の判定用オブジェクトを渡す
                const dayObj = (loadedMonthsCount === 0) ? now : null;
                
                card.innerHTML = generateCalendarHTML(targetYear, targetMonth, dayObj);
                container.appendChild(card);

                loadedMonthsCount++;
            }
            
            // 過去の不要なデータを削除
            cleanOldStorage(currentYear, currentMonth);
        }

        // 最初（または日付が変わった時）の状態に戻す
        function resetAndRenderInitialCalendars() {
            document.getElementById('calendar-container').innerHTML = '';
            loadedMonthsCount = 0;
            loadNextThreeMonths(); // 最初の3ヶ月分を読み込む
        }

        function cleanOldStorage(currentYear, currentMonth) {
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('date-')) {
                    const parts = key.split('-');
                    const savedYear = parseInt(parts[1]);
                    const savedMonth = parseInt(parts[2]);
                    
                    if (savedYear < currentYear || (savedYear === currentYear && savedMonth < currentMonth)) {
                        localStorage.removeItem(key);
                    }
                }
            }
        }

        // スリープ解除などの復帰時に画面をリフレッシュ
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                updateClock();
                resetAndRenderInitialCalendars();
            }
        });

        // 💡 【重要】一番下までスクロールしたのを自動検知する仕組み（Intersection Observer）
        const observer = new Intersection Observer((entries) => {
            if (entries[0].isIntersecting) {
                // 画面の下端（scroll-anchor）が見えたら、自動で次の3ヶ月分を追加
                loadNextThreeMonths();
            }
        }, { rootMargin: '100px' }); // 完全に底に着く手前（100px上）でフライング気味に読み込んで滑らかにする

        // 初期起動処理
        resetAndRenderInitialCalendars();
        observer.observe(document.getElementById('scroll-anchor'));
        
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
